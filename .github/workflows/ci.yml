name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - name: forge fmt (BUFI sources only)
        run: cd contracts && forge fmt --check src/bufi src/sandbox test script
      - name: forge build
        run: cd contracts && forge build --sizes
      - name: forge test
        run: cd contracts && forge test -vv
  packages:
    name: packages (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: bun install --frozen-lockfile
      - run: cd contracts && forge build
      - run: bun run check:type
      - run: bun run test
      - run: bun run build
  sandbox-e2e:
    name: sandbox e2e (anvil + mock circle + sdk)
    runs-on: ubuntu-latest
    needs: [contracts, packages]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: bun install --frozen-lockfile
      - run: cd contracts && forge build
      - run: bun run sandbox:e2e
