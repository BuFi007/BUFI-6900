# BUFI-6900 — single Foundry project for the redeployable Circle MSCA stack + BUFI plugins.
# Toolchain mirrors circlefin/buidl-wallet-contracts (solc 0.8.24, paris, via_ir, 200 runs)
# so bytecode-level behaviour of the vendored Circle sources is unchanged.
[profile.default]
src = 'src'
out = 'out'
test = 'test'
script = 'script'
libs = ['lib']
solc_version = "0.8.24"
evm_version = 'paris'
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_solc = false
auto_detect_remappings = false
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./lib/buidl-wallet-contracts/script/bytecode-deploy/build-output" },
]
no_match_coverage = "test/|script/|lib/"
# Fork-only suites (need --fork-url): run with `FOUNDRY_PROFILE=fork forge test --fork-url $SEPOLIA_RPC_URL`
no_match_path = "test/fork/**"

# Fork suites. Two profiles because the EVM version is both a compile target AND the interpreter the forked
# bytecode runs under, and the two pull in opposite directions:
#   * `fork`      — cancun. Needed to EXECUTE third-party bytecode that uses post-Paris opcodes (Morpho Vault V2
#                   uses MCOPY/TSTORE). Compiling Circle's vendored PluginManager under cancun + via-IR hits a Yul
#                   stack-too-deep, so this profile only compiles what the Morpho suite needs.
#   * `fork-arc`  — paris, matching the default profile exactly. Everything that touches the full Circle stack
#                   (agentic suites on Arc) uses this; no forked contract there needs a post-Paris opcode.
[profile.fork]
no_match_path = "test/fork/agentic/**"
match_path = "test/fork/earn/**"
evm_version = "cancun"

[profile.fork-arc]
no_match_path = "__never__/**"
match_path = "test/fork/{agentic,gateway}/**"
evm_version = "cancun"

# Arc's ERC-8183 contract runs post-Paris opcodes, so the interpreter must be cancun — but compiling Circle's
# vendored PluginManager under cancun + via-IR hits a Yul stack-too-deep. Pin Circle's tree to the EVM version
# Circle itself ships (paris) and let everything else use cancun. On a fork these compiled Circle artifacts are
# unused anyway: every Circle contract is the live on-chain bytecode.
[[profile.fork-arc.additional_compiler_profiles]]
name = "circle-paris"
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200

[[profile.fork-arc.compilation_restrictions]]
paths = "lib/buidl-wallet-contracts/**"
evm_version = "paris"

[profile.ci]
fuzz = { runs = 1024 }

[fuzz]
runs = 256

[invariant]
runs = 128
fail_on_revert = true
depth = 15

[fmt]
line_length = 120
wrap_comments = true
sort_imports = true

[rpc_endpoints]
local = "http://127.0.0.1:8545"
avax-fuji = "${AVAX_FUJI_RPC_URL}"
arc-testnet = "${ARC_TESTNET_RPC_URL}"
base-sepolia = "${BASE_SEPOLIA_RPC_URL}"
